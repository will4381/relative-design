<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-grow{0%{transform:scale(0)}55%{transform:scale(1.15)}75%{transform:scale(.95)}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-grow,.ic-trigger:hover .ic .ic-a-grow{animation-name:ic-grow}</style><mask id="ic-battery-line" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6.5h9.5a3 3 0 0 1 3 3v5a3 3 0 0 1-3 3h-9.5a3 3 0 0 1-3-3v-5a3 3 0 0 1 3-3Z" stroke="#fff"/><path d="M21 10.5v3" stroke="#fff"/><g class="ic-a ic-a-grow ic-o" style="transform-origin:6px 12px"><path d="M7 10h4a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1v-2a1 1 0 0 1 1-1Z" fill="#fff" stroke="none"/></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-battery-line)"/></svg>
