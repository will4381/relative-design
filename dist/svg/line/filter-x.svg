<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-squash{30%{transform:scale(1.14,.86)}55%{transform:scale(.94,1.06)}75%{transform:scale(1.03,.97)}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-squash,.ic-trigger:hover .ic .ic-a-squash{animation-name:ic-squash}@keyframes ic-turn{70%{transform:rotate(calc(var(--ic-deg,360deg) * 1.04))}100%{transform:rotate(var(--ic-deg,360deg))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-turn,.ic-trigger:hover .ic .ic-a-turn{animation-name:ic-turn}</style><mask id="ic-filter-x-line" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><g class="ic-a ic-a-squash ic-o" style="transform-origin:9.5px 4.5px"><path d="M4.86 7.23A1.75 1.75 0 0 1 6.31 4.5L12.24 4.5A1.75 1.75 0 0 1 13.58 7.38L11.1 10.33A1.5 1.5 0 0 0 10.75 11.3L10.75 18.75A1.25 1.25 0 0 1 9.5 20L8.5 20A1.25 1.25 0 0 1 7.25 18.75L7.25 11.21A1.5 1.5 0 0 0 6.99 10.37Z" stroke="#fff"/></g><g class="ic-a ic-a-turn ic-o" style="transform-origin:17.5px 16.5px;--ic-delay:0.06s;--ic-deg:90deg"><path d="M15 14l5 5M20 14l-5 5" stroke="#fff"/></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-filter-x-line)"/></svg>
