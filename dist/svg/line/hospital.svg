<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-pop{35%{transform:scale(var(--ic-s,1.18))}60%{transform:scale(calc(1 + (var(--ic-s,1.18) - 1) * -0.35))}80%{transform:scale(calc(1 + (var(--ic-s,1.18) - 1) * 0.12))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-pop,.ic-trigger:hover .ic .ic-a-pop{animation-name:ic-pop}</style><mask id="ic-hospital-line" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21A1.5 1.5 0 0 1 3.5 19.5L3.5 13A2 2 0 0 1 5.5 11L6.5 11A1 1 0 0 0 7.5 10L7.5 6.5A3 3 0 0 1 10.5 3.5L13.5 3.5A3 3 0 0 1 16.5 6.5L16.5 10A1 1 0 0 0 17.5 11L18.5 11A2 2 0 0 1 20.5 13L20.5 19.5A1.5 1.5 0 0 1 19 21Z" stroke="#fff"/><g class="ic-a ic-a-pop ic-o" style="transform-origin:12px 9.25px;--ic-s:1.25"><path d="M12 6.75v5M9.5 9.25h5" stroke="#fff"/></g><path d="M10 21v-2.25a2 2 0 0 1 4 0V21" stroke="#fff"/></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-hospital-line)"/></svg>
