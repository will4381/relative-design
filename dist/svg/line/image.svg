<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-enter{0%{transform:translate(var(--ic-x,0px),var(--ic-y,0px));opacity:0}60%{opacity:1}75%{transform:translate(calc(var(--ic-x,0px) * -0.12),calc(var(--ic-y,0px) * -0.12))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-enter,.ic-trigger:hover .ic .ic-a-enter{animation-name:ic-enter}</style><mask id="ic-image-line" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 3.5h9a4 4 0 0 1 4 4v9a4 4 0 0 1-4 4h-9a4 4 0 0 1-4-4v-9a4 4 0 0 1 4-4Z" stroke="#fff"/><path d="M7 16.5L9.95 13.13A0.75 0.75 0 0 1 11.07 13.12L12.72 14.92A0.75 0.75 0 0 0 13.8 14.95L14.19 14.56A0.75 0.75 0 0 1 15.28 14.59L17 16.5" stroke="#fff"/><g class="ic-a ic-a-enter" style="--ic-y:2px"><circle cx="15.25" cy="8.75" r="1.75" fill="#fff" stroke="none"/></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-image-line)"/></svg>
