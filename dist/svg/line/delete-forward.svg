<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-shake{12%{transform:translate(var(--ic-x,0px),var(--ic-y,0px))}28%{transform:translate(calc(var(--ic-x,0px) * -0.85),calc(var(--ic-y,0px) * -0.85))}44%{transform:translate(calc(var(--ic-x,0px) * 0.6),calc(var(--ic-y,0px) * 0.6))}60%{transform:translate(calc(var(--ic-x,0px) * -0.35),calc(var(--ic-y,0px) * -0.35))}76%{transform:translate(calc(var(--ic-x,0px) * 0.15),calc(var(--ic-y,0px) * 0.15))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-shake,.ic-trigger:hover .ic .ic-a-shake{animation-name:ic-shake}</style><mask id="ic-delete-forward-line" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><path d="M20.03 13.24A2 2 0 0 0 20.03 10.76L16.25 5.96A2.5 2.5 0 0 0 14.28 5L6.5 5A3.5 3.5 0 0 0 3 8.5L3 15.5A3.5 3.5 0 0 0 6.5 19L14.28 19A2.5 2.5 0 0 0 16.25 18.04Z" stroke="#fff"/><g class="ic-a ic-a-shake" style="--ic-x:1.25px"><path d="M7 9.5l5 5M12 9.5l-5 5" stroke="#fff"/></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-delete-forward-line)"/></svg>
