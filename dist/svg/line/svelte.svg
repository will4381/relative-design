<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-wiggle{15%{transform:rotate(var(--ic-deg,12deg))}35%{transform:rotate(calc(var(--ic-deg,12deg) * -.8))}55%{transform:rotate(calc(var(--ic-deg,12deg) * .45))}75%{transform:rotate(calc(var(--ic-deg,12deg) * -.15))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-wiggle,.ic-trigger:hover .ic .ic-a-wiggle{animation-name:ic-wiggle}</style><mask id="ic-svelte-line" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><g class="ic-a ic-a-wiggle" style="--ic-deg:10deg"><path d="M16.55 5.88A5.25 5.25 0 1 0 12 13.75A1.75 1.75 0 1 1 10.48 16.38A1.75 1.75 0 0 0 7.45 18.13A5.25 5.25 0 1 0 12 10.25A1.75 1.75 0 1 1 13.52 7.63A1.75 1.75 0 0 0 16.55 5.88Z" transform="rotate(20 12 12)" stroke="#fff"/></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-svelte-line)"/></svg>
