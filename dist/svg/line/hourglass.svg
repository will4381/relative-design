<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-turn{70%{transform:rotate(calc(var(--ic-deg,360deg) * 1.04))}100%{transform:rotate(var(--ic-deg,360deg))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-turn,.ic-trigger:hover .ic .ic-a-turn{animation-name:ic-turn}</style><mask id="ic-hourglass-line" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><g class="ic-a ic-a-turn ic-o" style="transform-origin:12px 12px;--ic-deg:180deg"><path d="M7.5 3h9v2.5c0 1.7-1 3.1-2.3 4L13 10.5c-.9.7-.9 2.3 0 3l1.2 1c1.3.9 2.3 2.3 2.3 4V21h-9v-2.5c0-1.7 1-3.1 2.3-4l1.2-1c.9-.7.9-2.3 0-3L9.8 9.5c-1.3-.9-2.3-2.3-2.3-4Z" stroke="#fff"/><path d="M5.5 3h13M5.5 21h13" stroke="#fff"/></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-hourglass-line)"/></svg>
