<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-pop{35%{transform:scale(var(--ic-s,1.18))}60%{transform:scale(calc(1 + (var(--ic-s,1.18) - 1) * -0.35))}80%{transform:scale(calc(1 + (var(--ic-s,1.18) - 1) * 0.12))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-pop,.ic-trigger:hover .ic .ic-a-pop{animation-name:ic-pop}</style><mask id="ic-pinterest-line" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" stroke="#fff"/><g class="ic-a ic-a-pop ic-o" style="transform-origin:12px 12px;--ic-s:0.86"><path d="M9.13 11.72A3.75 3.75 0 1 1 11.17 14.15M11.75 9 9.75 18.75" stroke="#fff"/></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-pinterest-line)"/></svg>
