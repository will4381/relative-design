<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-pop{35%{transform:scale(var(--ic-s,1.18))}60%{transform:scale(calc(1 + (var(--ic-s,1.18) - 1) * -0.35))}80%{transform:scale(calc(1 + (var(--ic-s,1.18) - 1) * 0.12))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-pop,.ic-trigger:hover .ic .ic-a-pop{animation-name:ic-pop}</style><mask id="ic-trophy-line" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><g class="ic-a ic-a-pop ic-o" style="transform-origin:12px 21px;--ic-s:1.15"><path d="M8 4h8a1.5 1.5 0 0 1 1.5 1.5v3a5.5 5.5 0 0 1-11 0v-3A1.5 1.5 0 0 1 8 4Z" stroke="#fff"/><path d="M6.5 6H5.25a2 2 0 0 0-2 2c0 2 1.5 3.25 3.75 3.25M17.5 6h1.25a2 2 0 0 1 2 2c0 2-1.5 3.25-3.75 3.25M12 14v3.5" stroke="#fff"/><path d="M10 17.5h4a2.5 2.5 0 0 1 2.5 2.5 1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1 2.5 2.5 0 0 1 2.5-2.5Z" stroke="#fff"/></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-trophy-line)"/></svg>
