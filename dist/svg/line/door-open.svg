<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-squash{30%{transform:scale(1.14,.86)}55%{transform:scale(.94,1.06)}75%{transform:scale(1.03,.97)}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-squash,.ic-trigger:hover .ic .ic-a-squash{animation-name:ic-squash}</style><mask id="ic-door-open-line" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V6a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v15M3 21h18" stroke="#fff"/><g class="ic-a ic-a-squash ic-o" style="transform-origin:5px 13.5px"><path d="M5 6.6A0.5 0.5 0 0 1 5.59 6.1L12.47 7.32A1.25 1.25 0 0 1 13.5 8.55L13.5 18.45A1.25 1.25 0 0 1 12.47 19.68L5.59 20.9A0.5 0.5 0 0 1 5 20.4Z" stroke="#fff"/></g><g class="ic-a ic-a-squash ic-o" style="transform-origin:5px 13.5px"><circle cx="10.75" cy="13.5" r="1" fill="#fff" stroke="none"/></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-door-open-line)"/></svg>
