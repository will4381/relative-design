<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-tilt{35%{transform:rotate(var(--ic-deg,-18deg))}55%{transform:rotate(calc(var(--ic-deg,-18deg) * .8))}80%{transform:rotate(calc(var(--ic-deg,-18deg) * -.1))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-tilt,.ic-trigger:hover .ic .ic-a-tilt{animation-name:ic-tilt}@keyframes ic-grow{0%{transform:scale(0)}55%{transform:scale(1.15)}75%{transform:scale(.95)}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-grow,.ic-trigger:hover .ic .ic-a-grow{animation-name:ic-grow}</style><mask id="ic-key-plus-line" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><g class="ic-a ic-a-tilt ic-o" style="transform-origin:8.25px 8.25px;--ic-deg:30deg"><circle cx="8.25" cy="8.25" r="5.25" stroke="#fff"/></g><g class="ic-a ic-a-tilt ic-o" style="transform-origin:8.25px 8.25px;--ic-deg:30deg"><circle cx="8.25" cy="8.25" r="1.6" fill="#fff" stroke="none"/></g><g class="ic-a ic-a-tilt ic-o" style="transform-origin:8.25px 8.25px;--ic-deg:30deg"><path d="M11.96 11.96L18.75 18.75" stroke="#fff"/></g><g class="ic-a ic-a-tilt ic-o" style="transform-origin:8.25px 8.25px;--ic-deg:30deg"><path d="M18.75 18.75l2.12-2.12" stroke="#fff"/></g><g class="ic-a ic-a-tilt ic-o" style="transform-origin:8.25px 8.25px;--ic-deg:30deg"><path d="M15.25 15.25l2.12-2.12" stroke="#fff"/></g><g class="ic-a ic-a-grow ic-o" style="transform-origin:18.5px 5.5px;--ic-delay:0.15s"><path d="M18.5 3v5M16 5.5h5" fill="#000" stroke="#000" style="stroke-width:calc(var(--ic-stroke,2px) + 3px)"/><path d="M18.5 3v5M16 5.5h5" stroke="#fff"/></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-key-plus-line)"/></svg>
