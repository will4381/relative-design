<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-heartbeat{14%{transform:scale(var(--ic-s,1.18))}28%{transform:scale(.96)}42%{transform:scale(calc(1 + (var(--ic-s,1.18) - 1) * 0.75))}62%{transform:scale(1)}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-heartbeat,.ic-trigger:hover .ic .ic-a-heartbeat{animation-name:ic-heartbeat}</style><mask id="ic-airbnb-line" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><g class="ic-a ic-a-heartbeat ic-o" style="transform-origin:12px 12px;--ic-s:1.12"><path d="M12 15.75C13.25 14.25 14.75 13 14.75 11.5A2.75 2.75 0 0 0 9.25 11.5C9.25 13 10.75 14.25 12 15.75C13.75 18 15.5 20.5 17.5 20.5C19.75 20.5 21.5 18.25 20.25 16L13.6 4.4C13 3.25 11 3.25 10.4 4.4L3.75 16C2.5 18.25 4.25 20.5 6.5 20.5C8.5 20.5 10.25 18 12 15.75Z" stroke="#fff"/></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-airbnb-line)"/></svg>
