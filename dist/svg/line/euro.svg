<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-draw{0%{stroke-dashoffset:1;opacity:0}6%{opacity:1}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-draw,.ic-trigger:hover .ic .ic-a-draw{animation-name:ic-draw}@keyframes ic-nudge{30%{transform:translate(var(--ic-x,0px),var(--ic-y,0px))}55%{transform:translate(calc(var(--ic-x,0px) * -0.3),calc(var(--ic-y,0px) * -0.3))}75%{transform:translate(calc(var(--ic-x,0px) * 0.1),calc(var(--ic-y,0px) * 0.1))}90%{transform:translate(calc(var(--ic-x,0px) * -0.03),calc(var(--ic-y,0px) * -0.03))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-nudge,.ic-trigger:hover .ic .ic-a-nudge{animation-name:ic-nudge}</style><mask id="ic-euro-line" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><g class="ic-a ic-a-draw"><path d="M19.35 6.05A8 8 0 1 0 19.35 17.95" pathLength="1" stroke-dasharray="1" stroke="#fff"/></g><g class="ic-a ic-a-nudge" style="--ic-delay:0.22s;--ic-x:-2px"><path d="M3.5 9.75H13" stroke="#fff"/></g><g class="ic-a ic-a-nudge" style="--ic-delay:0.3s;--ic-x:-2px"><path d="M3.5 14.25H13" stroke="#fff"/></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-euro-line)"/></svg>
