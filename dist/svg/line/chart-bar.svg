<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-grow{0%{transform:scale(0)}55%{transform:scale(1.15)}75%{transform:scale(.95)}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-grow,.ic-trigger:hover .ic .ic-a-grow{animation-name:ic-grow}</style><mask id="ic-chart-bar-line" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><g class="ic-a ic-a-grow ic-o" style="transform-origin:5.5px 20.5px"><path d="M5 13h1a1.5 1.5 0 0 1 1.5 1.5v4.5A1.5 1.5 0 0 1 6 20.5H5A1.5 1.5 0 0 1 3.5 19v-4.5A1.5 1.5 0 0 1 5 13Z" stroke="#fff"/></g><g class="ic-a ic-a-grow ic-o" style="transform-origin:12px 20.5px;--ic-delay:0.1s"><path d="M11.5 3.5h1A1.5 1.5 0 0 1 14 5v14a1.5 1.5 0 0 1-1.5 1.5h-1A1.5 1.5 0 0 1 10 19V5a1.5 1.5 0 0 1 1.5-1.5Z" stroke="#fff"/></g><g class="ic-a ic-a-grow ic-o" style="transform-origin:18.5px 20.5px;--ic-delay:0.2s"><path d="M18 8.5h1a1.5 1.5 0 0 1 1.5 1.5v9a1.5 1.5 0 0 1-1.5 1.5h-1a1.5 1.5 0 0 1-1.5-1.5v-9A1.5 1.5 0 0 1 18 8.5Z" stroke="#fff"/></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-chart-bar-line)"/></svg>
