<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-bounce{30%{transform:translateY(var(--ic-y,-3px))}55%{transform:translateY(0) scale(1.06,.92)}72%{transform:translateY(calc(var(--ic-y,-3px) * .22)) scale(.98,1.02)}88%{transform:translateY(0)}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-bounce,.ic-trigger:hover .ic .ic-a-bounce{animation-name:ic-bounce}</style><mask id="ic-paypal-line" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><g class="ic-a ic-a-bounce ic-o" style="transform-origin:12px 16px;--ic-delay:0.12s;--ic-y:-1.75px"><path d="M10 16V5.5a1.5 1.5 0 0 1 1.5-1.5h3a3.5 3.5 0 0 1 0 7H10" transform="translate(2.13 0) skewX(-10)" stroke="#fff"/></g><g class="ic-a ic-a-bounce ic-o" style="transform-origin:9px 20px;--ic-y:-1.75px"><path d="M6.5 20V9.5a1.5 1.5 0 0 1 1.5-1.5h3a3.5 3.5 0 0 1 0 7H6.5" transform="translate(2.13 0) skewX(-10)" fill="#000" stroke="#000" style="stroke-width:calc(var(--ic-stroke,2px) + 3px)"/><path d="M6.5 20V9.5a1.5 1.5 0 0 1 1.5-1.5h3a3.5 3.5 0 0 1 0 7H6.5" transform="translate(2.13 0) skewX(-10)" stroke="#fff"/></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor"