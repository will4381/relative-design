<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-draw{0%{stroke-dashoffset:1;opacity:0}6%{opacity:1}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-draw,.ic-trigger:hover .ic .ic-a-draw{animation-name:ic-draw}@keyframes ic-heartbeat{14%{transform:scale(var(--ic-s,1.18))}28%{transform:scale(.96)}42%{transform:scale(calc(1 + (var(--ic-s,1.18) - 1) * 0.75))}62%{transform:scale(1)}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-heartbeat,.ic-trigger:hover .ic .ic-a-heartbeat{animation-name:ic-heartbeat}</style><mask id="ic-heart-pulse-line" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><g class="ic-a ic-a-heartbeat ic-o" style="transform-origin:12px 12px;--ic-s:1.12"><path d="M10.7 19.1C4.9 15.2 3 12.2 3 8.9 3 6.1 5.1 4 7.8 4c1.8 0 3.3 1 4.2 2.5C12.9 5 14.4 4 16.2 4 18.9 4 21 6.1 21 8.9c0 3.3-1.9 6.3-7.7 10.2Q12 20 10.7 19.1Z" stroke="#fff"/><g class="ic-a ic-a-draw" style="--ic-delay:0.1s"><path d="M6.75 12H8.5c.9 0 1.1-2.75 2.1-2.75S12 15 13.1 15s1.2-3 2.15-3h2" pathLength="1" stroke-dasharray="1" stroke="#fff"/></g></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-heart-pulse-l