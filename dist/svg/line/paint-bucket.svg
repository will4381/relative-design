<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-tilt{35%{transform:rotate(var(--ic-deg,-18deg))}55%{transform:rotate(calc(var(--ic-deg,-18deg) * .8))}80%{transform:rotate(calc(var(--ic-deg,-18deg) * -.1))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-tilt,.ic-trigger:hover .ic .ic-a-tilt{animation-name:ic-tilt}@keyframes ic-enter{0%{transform:translate(var(--ic-x,0px),var(--ic-y,0px));opacity:0}60%{opacity:1}75%{transform:translate(calc(var(--ic-x,0px) * -0.12),calc(var(--ic-y,0px) * -0.12))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-enter,.ic-trigger:hover .ic .ic-a-enter{animation-name:ic-enter}</style><mask id="ic-paint-bucket-line" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><g class="ic-a ic-a-tilt ic-o" style="transform-origin:6.6px 12px;--ic-deg:-12deg"><path d="M10.5 9h5a2.5 2.5 0 0 1 2.5 2.5v5a2.5 2.5 0 0 1-2.5 2.5h-5a2.5 2.5 0 0 1-2.5-2.5v-5a2.5 2.5 0 0 1 2.5-2.5Z" transform="rotate(-30 13 14)" stroke="#fff"/></g><g class="ic-a ic-a-tilt ic-o" style="transform-origin:6.6px 12px;--ic-deg:-12deg"><path d="M9 9a4 4 0 0 1 8 0" transform="rotate(-30 13 14)" stroke="#fff"/></g><path d="M6.6 12C5.25 13 4.