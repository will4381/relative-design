<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-twinkle{30%{transform:scale(.55) rotate(-25deg)}65%{transform:scale(1.18) rotate(8deg)}85%{transform:scale(.97) rotate(-2deg)}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-twinkle,.ic-trigger:hover .ic .ic-a-twinkle{animation-name:ic-twinkle}</style><mask id="ic-gem-line" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><g class="ic-a ic-a-twinkle ic-o" style="transform-origin:12px 12px"><path d="M6.8 4.56A1.5 1.5 0 0 1 7.97 4L16.03 4A1.5 1.5 0 0 1 17.2 4.56L20.26 8.33A1.5 1.5 0 0 1 20.28 10.19L13.59 18.93A2 2 0 0 1 10.41 18.93L3.72 10.19A1.5 1.5 0 0 1 3.74 8.33Z" stroke="#fff"/></g><g class="ic-a ic-a-twinkle ic-o" style="transform-origin:12px 12px"><path d="M3.75 9.25h16.5M8.5 9.25 12 19M15.5 9.25 12 19" stroke="#fff"/></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-gem-line)"/></svg>
