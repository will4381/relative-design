<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-turn{70%{transform:rotate(calc(var(--ic-deg,360deg) * 1.04))}100%{transform:rotate(var(--ic-deg,360deg))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-turn,.ic-trigger:hover .ic .ic-a-turn{animation-name:ic-turn}</style><mask id="ic-openai-line" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><g class="ic-a ic-a-turn ic-o" style="transform-origin:12px 12px;--ic-deg:60deg"><path d="M10.5 9.75L16 9.75A2.25 2.25 0 0 0 16 5.25L10.5 5.25A2.25 2.25 0 0 0 10.5 9.75ZM13.2 9.58L15.95 14.34A2.25 2.25 0 0 0 19.85 12.09L17.1 7.33A2.25 2.25 0 0 0 13.2 9.58ZM14.7 11.83L11.95 16.59A2.25 2.25 0 0 0 15.85 18.84L18.6 14.08A2.25 2.25 0 0 0 14.7 11.83ZM13.5 14.25L8 14.25A2.25 2.25 0 0 0 8 18.75L13.5 18.75A2.25 2.25 0 0 0 13.5 14.25ZM10.8 14.42L8.05 9.66A2.25 2.25 0 0 0 4.15 11.91L6.9 16.67A2.25 2.25 0 0 0 10.8 14.42ZM9.3 12.17L12.05 7.41A2.25 2.25 0 0 0 8.15 5.16L5.4 9.92A2.25 2.25 0 0 0 9.3 12.17Z" stroke="#fff"/></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-openai-line)"/></svg>
