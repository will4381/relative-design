<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-nudge{30%{transform:translate(var(--ic-x,0px),var(--ic-y,0px))}55%{transform:translate(calc(var(--ic-x,0px) * -0.3),calc(var(--ic-y,0px) * -0.3))}75%{transform:translate(calc(var(--ic-x,0px) * 0.1),calc(var(--ic-y,0px) * 0.1))}90%{transform:translate(calc(var(--ic-x,0px) * -0.03),calc(var(--ic-y,0px) * -0.03))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-nudge,.ic-trigger:hover .ic .ic-a-nudge{animation-name:ic-nudge}</style><mask id="ic-slack-line" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><g class="ic-a ic-a-nudge" style="--ic-x:0px;--ic-y:-2px"><path d="M7.5 3.5h0a2 2 0 0 1 2 2v3.5a2 2 0 0 1-2 2h-0a2 2 0 0 1-2-2v-3.5a2 2 0 0 1 2-2Z" stroke="#fff"/></g><g class="ic-a ic-a-nudge" style="--ic-delay:0.07s;--ic-x:2px;--ic-y:0px"><path d="M15 5.5h3.5a2 2 0 0 1 2 2v0a2 2 0 0 1-2 2h-3.5a2 2 0 0 1-2-2v-0a2 2 0 0 1 2-2Z" stroke="#fff"/></g><g class="ic-a ic-a-nudge" style="--ic-delay:0.14s;--ic-x:0px;--ic-y:2px"><path d="M16.5 13h0a2 2 0 0 1 2 2v3.5a2 2 0 0 1-2 2h-0a2 2 0 0 1-2-2v-3.5a2 2 0 0 1 2-2Z" stroke="#fff"/></g><g class="ic-a ic-a-nudge" style="--ic-delay:0.21000