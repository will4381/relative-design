<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-squash{30%{transform:scale(1.14,.86)}55%{transform:scale(.94,1.06)}75%{transform:scale(1.03,.97)}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-squash,.ic-trigger:hover .ic .ic-a-squash{animation-name:ic-squash}@keyframes ic-pulse{45%{opacity:.15}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-pulse,.ic-trigger:hover .ic .ic-a-pulse{animation-name:ic-pulse}</style><mask id="ic-volume-low-line" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><g class="ic-a ic-a-squash ic-o" style="transform-origin:11.5px 12px"><path d="M3.5 9.75A1.25 1.25 0 0 1 4.75 8.5L6.52 8.5A1.25 1.25 0 0 0 7.36 8.18L9.42 6.35A1.25 1.25 0 0 1 11.5 7.28L11.5 16.72A1.25 1.25 0 0 1 9.42 17.65L7.36 15.82A1.25 1.25 0 0 0 6.52 15.5L4.75 15.5A1.25 1.25 0 0 1 3.5 14.25Z" stroke="#fff"/></g><g class="ic-a ic-a-pulse" style="--ic-delay:0.1s"><path d="M15.25 9a4.25 4.25 0 0 1 0 6" stroke="#fff"/></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-volume-low-line)"/></svg>
