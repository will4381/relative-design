<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-pop{35%{transform:scale(var(--ic-s,1.18))}60%{transform:scale(calc(1 + (var(--ic-s,1.18) - 1) * -0.35))}80%{transform:scale(calc(1 + (var(--ic-s,1.18) - 1) * 0.12))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-pop,.ic-trigger:hover .ic .ic-a-pop{animation-name:ic-pop}</style><mask id="ic-shapes-line" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><g class="ic-a ic-a-pop" style="--ic-s:1.15"><path d="M5.5 3.5h2.75a2 2 0 0 1 2 2v2.75a2 2 0 0 1-2 2h-2.75a2 2 0 0 1-2-2v-2.75a2 2 0 0 1 2-2Z" stroke="#fff"/></g><g class="ic-a ic-a-pop ic-o" style="transform-origin:12px 17.5px;--ic-delay:0.1s;--ic-s:1.15"><path d="M10.48 14.13A1.75 1.75 0 0 1 13.52 14.13L15.68 17.88A1.75 1.75 0 0 1 14.17 20.5L9.83 20.5A1.75 1.75 0 0 1 8.32 17.88Z" stroke="#fff"/></g><g class="ic-a ic-a-pop" style="--ic-delay:0.2s;--ic-s:1.15"><circle cx="17" cy="6.875" r="3.5" stroke="#fff"/></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-shapes-line)"/></svg>
