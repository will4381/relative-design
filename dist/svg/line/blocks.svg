<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-bounce{30%{transform:translateY(var(--ic-y,-3px))}55%{transform:translateY(0) scale(1.06,.92)}72%{transform:translateY(calc(var(--ic-y,-3px) * .22)) scale(.98,1.02)}88%{transform:translateY(0)}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-bounce,.ic-trigger:hover .ic .ic-a-bounce{animation-name:ic-bounce}</style><mask id="ic-blocks-line" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 5.5A2 2 0 0 1 5.5 3.5L7.75 3.5A2 2 0 0 1 9.75 5.5L9.75 12.25A2 2 0 0 0 11.75 14.25L18.5 14.25A2 2 0 0 1 20.5 16.25L20.5 18.5A2 2 0 0 1 18.5 20.5L5.5 20.5A2 2 0 0 1 3.5 18.5Z" stroke="#fff"/><g class="ic-a ic-a-bounce ic-o" style="transform-origin:17.375px 9.75px;--ic-y:-2.5px"><path d="M16.25 3.5h2.25a2 2 0 0 1 2 2v2.25a2 2 0 0 1-2 2h-2.25a2 2 0 0 1-2-2v-2.25a2 2 0 0 1 2-2Z" stroke="#fff"/></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-blocks-line)"/></svg>
