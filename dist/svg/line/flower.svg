<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-wiggle{15%{transform:rotate(var(--ic-deg,12deg))}35%{transform:rotate(calc(var(--ic-deg,12deg) * -.8))}55%{transform:rotate(calc(var(--ic-deg,12deg) * .45))}75%{transform:rotate(calc(var(--ic-deg,12deg) * -.15))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-wiggle,.ic-trigger:hover .ic .ic-a-wiggle{animation-name:ic-wiggle}@keyframes ic-tilt{35%{transform:rotate(var(--ic-deg,-18deg))}55%{transform:rotate(calc(var(--ic-deg,-18deg) * .8))}80%{transform:rotate(calc(var(--ic-deg,-18deg) * -.1))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-tilt,.ic-trigger:hover .ic .ic-a-tilt{animation-name:ic-tilt}</style><mask id="ic-flower-line" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><g class="ic-a ic-a-wiggle ic-o" style="transform-origin:12px 15.5px;--ic-deg:12deg"><path d="M5.9 6.97A1.25 1.25 0 0 1 8.12 6.12L8.79 6.94A0.5 0.5 0 0 0 9.61 6.88L10.7 4.99A1.5 1.5 0 0 1 13.3 4.99L14.39 6.88A0.5 0.5 0 0 0 15.21 6.94L15.88 6.12A1.25 1.25 0 0 1 18.1 6.97L17.98 9.98A5.75 5.75 0 0 1 12.23 15.5L11.77 15.5A5.75 5.75 0 0 1 6.02 9.98Z" stroke="#fff"/></g><path d="M12 15.5V21" stroke="#fff"/><g class="ic-a ic-a-tilt ic-o" style="transform-origin:12px 20px;--ic-delay:0.1s;--ic-deg:15deg"><path d="M14.07 19.9A1.5 1.5 0 0 1 12.35 18.18L12.52 17.16A2 2 0 0 1 14.16 15.52L15.18 15.35A1.5 1.5 0 0 1 16.9 17.07L16.73 18.09A2 2 0 0 1 15.09 19.73Z" stroke="#fff"/></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-flower-line)"/></svg>
