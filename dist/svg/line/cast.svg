<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-pulse{45%{opacity:.15}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-pulse,.ic-trigger:hover .ic .ic-a-pulse{animation-name:ic-pulse}</style><mask id="ic-cast-line" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8a4 4 0 0 1 4-4h9a4 4 0 0 1 4 4v8.5a4 4 0 0 1-4 4h-1" stroke="#fff"/><g class="ic-a ic-a-pulse"><circle cx="3.5" cy="20.5" r="0.5" stroke="#fff"/></g><g class="ic-a ic-a-pulse" style="--ic-delay:0.1s"><path d="M3.5 16a4.5 4.5 0 0 1 4.5 4.5" stroke="#fff"/></g><g class="ic-a ic-a-pulse" style="--ic-delay:0.2s"><path d="M3.5 11.5a9 9 0 0 1 9 9" stroke="#fff"/></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-cast-line)"/></svg>
