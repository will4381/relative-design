<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-pulse{45%{opacity:.15}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-pulse,.ic-trigger:hover .ic .ic-a-pulse{animation-name:ic-pulse}</style><mask id="ic-wifi-line" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><g class="ic-a ic-a-pulse"><path d="M12 18.5h0" stroke="#fff" stroke-linecap="round" style="stroke-width:calc(var(--ic-stroke,2px) + 1px)"/></g><g class="ic-a ic-a-pulse" style="--ic-delay:0.08s"><path d="M9.23 14.95a4.5 4.5 0 0 1 5.54 0" stroke="#fff"/></g><g class="ic-a ic-a-pulse" style="--ic-delay:0.16s"><path d="M6.46 11.41a9 9 0 0 1 11.08 0" stroke="#fff"/></g><g class="ic-a ic-a-pulse" style="--ic-delay:0.24s"><path d="M3.69 7.86a13.5 13.5 0 0 1 16.62 0" stroke="#fff"/></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-wifi-line)"/></svg>
