<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-draw{0%{stroke-dashoffset:1;opacity:0;animation-timing-function:cubic-bezier(.25,.8,.3,1)}5%{opacity:1}40%{stroke-dashoffset:0}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-draw,.ic-trigger:hover .ic .ic-a-draw{animation-name:ic-draw}</style><mask id="ic-fingerprint-line" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><g class="ic-a ic-a-draw"><path d="M3.5 15.5V12a8.5 8.5 0 0 1 15.4-5" pathLength="1" stroke-dasharray="1" stroke="#fff"/></g><g class="ic-a ic-a-draw" style="--ic-delay:0.08s"><path d="M20.5 11v2.5c0 2.6-.6 5-1.75 7" pathLength="1" stroke-dasharray="1" stroke="#fff"/></g><g class="ic-a ic-a-draw" style="--ic-delay:0.16s"><path d="M7.5 19V12a4.5 4.5 0 0 1 9 0v2c0 2.2-.6 4.3-1.75 6" pathLength="1" stroke-dasharray="1" stroke="#fff"/></g><g class="ic-a ic-a-draw" style="--ic-delay:0.24s"><path d="M12 12v2.5c0 2-.6 4-1.75 5.75" pathLength="1" stroke-dasharray="1" stroke="#fff"/></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-fingerprint-line)"/></svg>
