<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-bounce{30%{transform:translateY(var(--ic-y,-3px))}55%{transform:translateY(0) scale(1.06,.92)}72%{transform:translateY(calc(var(--ic-y,-3px) * .22)) scale(.98,1.02)}88%{transform:translateY(0)}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-bounce,.ic-trigger:hover .ic .ic-a-bounce{animation-name:ic-bounce}</style><mask id="ic-palette-line" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 0 0 0 18c1.4 0 2-.9 2-2 0-.6-.3-1-.6-1.4-.3-.4-.4-.8-.4-1.3 0-1.2 1-2.3 2.3-2.3h2.2a3.5 3.5 0 0 0 3.5-3.5C21 6.6 17 3 12 3Z" stroke="#fff"/><g class="ic-a ic-a-bounce" style="--ic-y:-1px"><circle cx="7.5" cy="12" r="1.25" fill="#fff" stroke="none"/></g><g class="ic-a ic-a-bounce" style="--ic-delay:0.07s;--ic-y:-1px"><circle cx="9" cy="8" r="1.25" fill="#fff" stroke="none"/></g><g class="ic-a ic-a-bounce" style="--ic-delay:0.14s;--ic-y:-1px"><circle cx="13" cy="7" r="1.25" fill="#fff" stroke="none"/></g><g class="ic-a ic-a-bounce" style="--ic-delay:0.21s;--ic-y:-1px"><circle cx="16.5" cy="9" r="1.25" fill="#fff" stroke="none"/></g></g></mask><rect x="-6" y="-6" width="3