<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-twinkle{30%{transform:scale(.55) rotate(-25deg)}65%{transform:scale(1.18) rotate(8deg)}85%{transform:scale(.97) rotate(-2deg)}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-twinkle,.ic-trigger:hover .ic .ic-a-twinkle{animation-name:ic-twinkle}</style><mask id="ic-star-line" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><g class="ic-a ic-a-twinkle ic-o" style="transform-origin:12px 12.4px"><path d="M10.17 5.23A2 2 0 0 1 13.83 5.23L14.88 7.59A1 1 0 0 0 15.69 8.17L18.26 8.45A2 2 0 0 1 19.38 11.92L17.47 13.65A1 1 0 0 0 17.16 14.6L17.69 17.13A2 2 0 0 1 14.74 19.27L12.5 17.99A1 1 0 0 0 11.5 17.99L9.26 19.27A2 2 0 0 1 6.31 17.13L6.84 14.6A1 1 0 0 0 6.53 13.65L4.62 11.92A2 2 0 0 1 5.74 8.45L8.31 8.17A1 1 0 0 0 9.12 7.59Z" stroke="#fff"/></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-star-line)"/></svg>
