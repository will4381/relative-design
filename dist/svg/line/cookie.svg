<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-wiggle{15%{transform:rotate(var(--ic-deg,12deg))}35%{transform:rotate(calc(var(--ic-deg,12deg) * -.8))}55%{transform:rotate(calc(var(--ic-deg,12deg) * .45))}75%{transform:rotate(calc(var(--ic-deg,12deg) * -.15))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-wiggle,.ic-trigger:hover .ic .ic-a-wiggle{animation-name:ic-wiggle}@keyframes ic-enter{0%{transform:translate(var(--ic-x,0px),var(--ic-y,0px));opacity:0}60%{opacity:1}75%{transform:translate(calc(var(--ic-x,0px) * -0.12),calc(var(--ic-y,0px) * -0.12))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-enter,.ic-trigger:hover .ic .ic-a-enter{animation-name:ic-enter}</style><mask id="ic-cookie-line" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><g class="ic-a ic-a-wiggle ic-o" style="transform-origin:12px 12px;--ic-deg:8deg"><path d="M20.7 9.68A9 9 0 1 1 14.32 3.3A1.25 1.25 0 0 1 15.25 4.51A4.25 4.25 0 0 0 19.49 8.75A1.25 1.25 0 0 1 20.7 9.68Z" stroke="#fff"/></g><g class="ic-a ic-a-wiggle ic-o" style="transform-origin:12px 12px;--ic-deg:8deg"><circle cx="8" cy="9.5" r="1.25" fill="#fff" stroke="none"/></g><g class="ic-a ic-a-wiggle ic-o" style="transform-origin:12px 12px;--ic-deg:8deg"><circle cx="12.5" cy="12.5" r="1.1" fill="#fff" stroke="none"/></g><g class="ic-a ic-a-wiggle ic-o" style="transform-origin:12px 12px;--ic-deg:8deg"><circle cx="8.5" cy="15.5" r="1.1" fill="#fff" stroke="none"/></g><g class="ic-a ic-a-wiggle ic-o" style="transform-origin:12px 12px;--ic-deg:8deg"><circle cx="15" cy="16.5" r="1.25" fill="#fff" stroke="none"/></g><g class="ic-a ic-a-enter" style="--ic-delay:0.15s;--ic-y:-2px"><circle cx="19.5" cy="4.5" r="0.5" stroke="#fff"/></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-cookie-line)"/></svg>
