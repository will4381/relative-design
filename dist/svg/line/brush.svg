<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-wiggle{15%{transform:rotate(var(--ic-deg,12deg))}35%{transform:rotate(calc(var(--ic-deg,12deg) * -.8))}55%{transform:rotate(calc(var(--ic-deg,12deg) * .45))}75%{transform:rotate(calc(var(--ic-deg,12deg) * -.15))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-wiggle,.ic-trigger:hover .ic .ic-a-wiggle{animation-name:ic-wiggle}</style><mask id="ic-brush-line" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><g class="ic-a ic-a-wiggle ic-o" style="transform-origin:19.4px 4.6px;--ic-deg:12deg"><path d="M12 1.5V9.5" transform="rotate(45 12 12)" stroke="#fff"/><path d="M9.12 15.84A3 3 0 1 1 14.88 15.84L13.2 21.6A1.25 1.25 0 0 1 10.8 21.6Z" transform="rotate(45 12 12)" stroke="#fff"/></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-brush-line)"/></svg>
