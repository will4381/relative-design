<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-enter{0%{transform:translate(var(--ic-x,0px),var(--ic-y,0px));opacity:0}60%{opacity:1}75%{transform:translate(calc(var(--ic-x,0px) * -0.12),calc(var(--ic-y,0px) * -0.12))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-enter,.ic-trigger:hover .ic .ic-a-enter{animation-name:ic-enter}</style><mask id="ic-flask-line" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><path d="M9.75 3.75A0.75 0.75 0 0 1 10.5 3L13.5 3A0.75 0.75 0 0 1 14.25 3.75L14.25 8.14A1.5 1.5 0 0 0 14.41 8.82L18.83 17.48A2.25 2.25 0 0 1 16.83 20.75L7.17 20.75A2.25 2.25 0 0 1 5.17 17.48L9.59 8.82A1.5 1.5 0 0 0 9.75 8.14Z" stroke="#fff"/><path d="M8.5 3h7" stroke="#fff"/><path d="M7.75 14.5c1.4-.75 2.85-.75 4.25 0s2.85.75 4.25 0" stroke="#fff"/><g class="ic-a ic-a-enter" style="--ic-y:2px"><circle cx="10.25" cy="17.75" r="1.25" fill="#fff" stroke="none"/></g><g class="ic-a ic-a-enter" style="--ic-delay:0.14s;--ic-y:2px"><circle cx="14" cy="17.25" r="1" fill="#fff" stroke="none"/></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-flask-line)"/></svg>
