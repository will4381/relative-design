<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-enter{0%{transform:translate(var(--ic-x,0px),var(--ic-y,0px));opacity:0}60%{opacity:1}75%{transform:translate(calc(var(--ic-x,0px) * -0.12),calc(var(--ic-y,0px) * -0.12))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-enter,.ic-trigger:hover .ic .ic-a-enter{animation-name:ic-enter}</style><mask id="ic-netflix-fill" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><g class="ic-a ic-a-enter" style="--ic-y:3px"><path d="M6.75 3.75V20.25" stroke="#fff"/></g><g class="ic-a ic-a-enter" style="--ic-delay:0.1s;--ic-y:-3px"><path d="M17.25 3.75V20.25" stroke="#fff"/></g><path d="M5.71 5.65A1.24 1.24 0 0 1 6.75 3.75L8.45 3.75A1 1 0 0 1 9.29 4.21L18.29 18.35A1.24 1.24 0 0 1 17.25 20.25L15.55 20.25A1 1 0 0 1 14.71 19.79Z" fill="#000" stroke="#000" style="stroke-width:calc(var(--ic-stroke,2px) + 3px)"/><path d="M5.71 5.65A1.24 1.24 0 0 1 6.75 3.75L8.45 3.75A1 1 0 0 1 9.29 4.21L18.29 18.35A1.24 1.24 0 0 1 17.25 20.25L15.55 20.25A1 1 0 0 1 14.71 19.79Z" fill="#fff" stroke="#fff"/></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-netflix-fill)"/></svg