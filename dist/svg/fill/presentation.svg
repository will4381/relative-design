<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-grow{0%{transform:scale(0)}55%{transform:scale(1.15)}75%{transform:scale(.95)}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-grow,.ic-trigger:hover .ic .ic-a-grow{animation-name:ic-grow}</style><mask id="ic-presentation-fill" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h12a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3h-12a3 3 0 0 1-3-3v-7a3 3 0 0 1 3-3Z" fill="#fff" stroke="#fff"/><g class="ic-a ic-a-grow ic-o" style="transform-origin:8px 13px"><path d="M8 13v-2" stroke="#000"/></g><g class="ic-a ic-a-grow ic-o" style="transform-origin:12px 13px;--ic-delay:0.1s"><path d="M12 13V7.5" stroke="#000"/></g><g class="ic-a ic-a-grow ic-o" style="transform-origin:16px 13px;--ic-delay:0.2s"><path d="M16 13V9.5" stroke="#000"/></g><path d="M10.5 16.5L9 21M13.5 16.5L15 21" stroke="#fff"/></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-presentation-fill)"/></svg>
