<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-draw{0%{stroke-dashoffset:1;opacity:0;animation-timing-function:cubic-bezier(.25,.8,.3,1)}5%{opacity:1}40%{stroke-dashoffset:0}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-draw,.ic-trigger:hover .ic .ic-a-draw{animation-name:ic-draw}</style><mask id="ic-sheet-fill" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3.5h10a4 4 0 0 1 4 4v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4v-9a4 4 0 0 1 4-4Z" fill="#fff" stroke="#fff"/><path d="M3 9.5h18" stroke="#000"/><g class="ic-a ic-a-draw" style="--ic-delay:0.05s"><path d="M9.5 9.5v11" pathLength="1" stroke-dasharray="1" stroke="#000"/></g><g class="ic-a ic-a-draw" style="--ic-delay:0.15s"><path d="M3 15h18" pathLength="1" stroke-dasharray="1" stroke="#000"/></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-sheet-fill)"/></svg>
