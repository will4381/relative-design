<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-wiggle{15%{transform:rotate(var(--ic-deg,12deg))}35%{transform:rotate(calc(var(--ic-deg,12deg) * -.8))}55%{transform:rotate(calc(var(--ic-deg,12deg) * .45))}75%{transform:rotate(calc(var(--ic-deg,12deg) * -.15))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-wiggle,.ic-trigger:hover .ic .ic-a-wiggle{animation-name:ic-wiggle}</style><mask id="ic-earth-fill" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" fill="#fff" stroke="#fff"/><g class="ic-a ic-a-wiggle ic-o" style="transform-origin:12px 12px;--ic-deg:8deg"><path d="M7 7.5c1.5-1 3.5-.75 4.25.5.6 1-.4 2-1.5 2.5-.9.4-1 1.6-2 1.75-1.25.2-2.25-.9-2.25-2.25 0-1 .5-1.9 1.5-2.5Z" fill="#000" stroke="none"/></g><g class="ic-a ic-a-wiggle ic-o" style="transform-origin:12px 12px;--ic-delay:0.05s;--ic-deg:8deg"><path d="M13 12.75c1.25-.5 3 .25 3.75 1.5.8 1.3.5 3-.75 3.75-1.1.7-2.6.4-3.25-.6-.5-.8-.2-1.4-.6-2.2-.4-.9.1-2.1.85-2.45Z" fill="#000" stroke="none"/></g><g class="ic-a ic-a-wiggle ic-o" style="transform-origin:12px 12px;--ic-delay:0.1s;--ic-deg:8deg"><circle cx="16.25" cy="8" r="1" fill="#000