<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-twinkle{30%{transform:scale(.55) rotate(-25deg)}65%{transform:scale(1.18) rotate(8deg)}85%{transform:scale(.97) rotate(-2deg)}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-twinkle,.ic-trigger:hover .ic .ic-a-twinkle{animation-name:ic-twinkle}@keyframes ic-bounce{30%{transform:translateY(var(--ic-y,-3px))}55%{transform:translateY(0) scale(1.06,.92)}72%{transform:translateY(calc(var(--ic-y,-3px) * .22)) scale(.98,1.02)}88%{transform:translateY(0)}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-bounce,.ic-trigger:hover .ic .ic-a-bounce{animation-name:ic-bounce}</style><mask id="ic-crown-fill" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><g class="ic-a ic-a-bounce ic-o" style="transform-origin:12px 20.5px;--ic-y:-1.5px"><path d="M7.25 17.5Q5.25 17.5 4.88 15.53L3.92 10.46Q3.5 8.25 5.21 9.71L7.17 11.37Q8.5 12.5 9.28 10.93L10.99 7.51Q12 5.5 13.01 7.51L14.72 10.93Q15.5 12.5 16.83 11.37L18.79 9.71Q20.5 8.25 20.08 10.46L19.12 15.53Q18.75 17.5 16.75 17.5Z" fill="#fff" stroke="#fff"/><g class="ic-a ic-a-twinkle" style="--ic-delay:0.18s"><circle cx="12" cy="13.75" r="1.25" fill="