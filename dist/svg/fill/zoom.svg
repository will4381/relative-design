<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-pop{35%{transform:scale(var(--ic-s,1.18))}60%{transform:scale(calc(1 + (var(--ic-s,1.18) - 1) * -0.35))}80%{transform:scale(calc(1 + (var(--ic-s,1.18) - 1) * 0.12))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-pop,.ic-trigger:hover .ic .ic-a-pop{animation-name:ic-pop}</style><mask id="ic-zoom-fill" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><g class="ic-a ic-a-pop ic-o" style="transform-origin:12px 12px;--ic-s:1.12"><path d="M5.25 8.25h7.25a2 2 0 0 1 2 2v3.5a2 2 0 0 1-2 2h-7.25a2 2 0 0 1-2-2v-3.5a2 2 0 0 1 2-2Z" fill="#fff" stroke="#fff"/><path d="M17.5 10.74A0.4 0.4 0 0 1 17.71 10.39L19.87 9.23A0.6 0.6 0 0 1 20.75 9.75L20.75 14.25A0.6 0.6 0 0 1 19.87 14.77L17.71 13.61A0.4 0.4 0 0 1 17.5 13.26Z" fill="#fff" stroke="#fff"/></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-zoom-fill)"/></svg>
