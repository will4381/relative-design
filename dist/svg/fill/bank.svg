<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-grow{0%{transform:scale(0)}55%{transform:scale(1.15)}75%{transform:scale(.95)}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-grow,.ic-trigger:hover .ic .ic-a-grow{animation-name:ic-grow}</style><mask id="ic-bank-fill" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><path d="M10.83 3.62A2.5 2.5 0 0 1 13.17 3.62L19.84 7.15A1.25 1.25 0 0 1 20.5 8.25L20.5 8.25A0.75 0.75 0 0 1 19.75 9L4.25 9A0.75 0.75 0 0 1 3.5 8.25L3.5 8.25A1.25 1.25 0 0 1 4.16 7.15Z" fill="#fff" stroke="#fff"/><g class="ic-a ic-a-grow ic-o" style="transform-origin:6.5px 17px"><path d="M6.5 12.5v4.5" stroke="#fff"/></g><g class="ic-a ic-a-grow ic-o" style="transform-origin:12px 17px;--ic-delay:0.08s"><path d="M12 12.5v4.5" stroke="#fff"/></g><g class="ic-a ic-a-grow ic-o" style="transform-origin:17.5px 17px;--ic-delay:0.16s"><path d="M17.5 12.5v4.5" stroke="#fff"/></g><path d="M3.5 20.5h17" stroke="#fff"/></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-bank-fill)"/></svg>
