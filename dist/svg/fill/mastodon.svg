<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-squash{30%{transform:scale(1.14,.86)}55%{transform:scale(.94,1.06)}75%{transform:scale(1.03,.97)}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-squash,.ic-trigger:hover .ic .ic-a-squash{animation-name:ic-squash}</style><mask id="ic-mastodon-fill" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><path d="M10 16.5H15.5A4.5 4.5 0 0 0 20 12V8A4.5 4.5 0 0 0 15.5 3.5H8.5A4.5 4.5 0 0 0 4 8V15C4 19 7.25 20.75 12.75 20" fill="#fff" stroke="#fff"/><g class="ic-a ic-a-squash ic-o" style="transform-origin:12px 13px"><path d="M7.75 13V10.5a2.125 2.125 0 0 1 4.25 0V12.5M12 10.5a2.125 2.125 0 0 1 4.25 0V13" stroke="#000"/></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-mastodon-fill)"/></svg>
