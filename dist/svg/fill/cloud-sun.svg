<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-turn{70%{transform:rotate(calc(var(--ic-deg,360deg) * 1.04))}100%{transform:rotate(var(--ic-deg,360deg))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-turn,.ic-trigger:hover .ic .ic-a-turn{animation-name:ic-turn}@keyframes ic-float{50%{transform:translate(var(--ic-x,0px),var(--ic-y,-2px))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-float,.ic-trigger:hover .ic .ic-a-float{animation-name:ic-float}</style><mask id="ic-cloud-sun-fill" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="3.25" fill="#fff" stroke="#fff"/><g class="ic-a ic-a-turn ic-o" style="transform-origin:9px 9px;--ic-deg:45deg"><path d="M14.25 9L15.5 9M12.71 12.71L13.6 13.6M9 14.25L9 15.5M5.29 12.71L4.4 13.6M3.75 9L2.5 9M5.29 5.29L4.4 4.4M9 3.75L9 2.5M12.71 5.29L13.6 4.4" stroke="#fff"/></g><g class="ic-a ic-a-float" style="--ic-x:1.25px;--ic-y:0px"><path d="M11.64 20.58A2.88 2.88 0 0 1 11.64 14.82A3.96 3.96 0 0 1 19.56 14.89A2.88 2.88 0 0 1 18.84 20.58Z" fill="#000" stroke="#000" style="stroke-width:calc(var(--ic-stroke,2px) + 3px)"/><path d="M11.64 20.58A2.88 2.88 0 0 1 11.64 14.