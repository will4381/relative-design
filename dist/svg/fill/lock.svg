<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-bounce{30%{transform:translateY(var(--ic-y,-3px))}55%{transform:translateY(0) scale(1.06,.92)}72%{transform:translateY(calc(var(--ic-y,-3px) * .22)) scale(.98,1.02)}88%{transform:translateY(0)}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-bounce,.ic-trigger:hover .ic .ic-a-bounce{animation-name:ic-bounce}@keyframes ic-shake{12%{transform:translate(var(--ic-x,0px),var(--ic-y,0px))}28%{transform:translate(calc(var(--ic-x,0px) * -0.85),calc(var(--ic-y,0px) * -0.85))}44%{transform:translate(calc(var(--ic-x,0px) * 0.6),calc(var(--ic-y,0px) * 0.6))}60%{transform:translate(calc(var(--ic-x,0px) * -0.35),calc(var(--ic-y,0px) * -0.35))}76%{transform:translate(calc(var(--ic-x,0px) * 0.15),calc(var(--ic-y,0px) * 0.15))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-shake,.ic-trigger:hover .ic .ic-a-shake{animation-name:ic-shake}</style><mask id="ic-lock-fill" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><g class="ic-a ic-a-bounce ic-o" style="transform-origin:12px 10.5px;--ic-y:-2.5px"><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3" stroke="#fff"/></g><g class="ic-a ic-a-shake" style="--ic-delay:0.18s;--ic-x:1px"><path d="M7.5 10.5h9a3 3 0 0 1 3 3v4.5a3 3 0 0 1-3 3h-9a3 3 0 0 1-3-3v-4.5a3 3 0 0 1 3-3Z" fill="#fff" stroke="#fff"/></g><g class="ic-a ic-a-shake" style="--ic-delay:0.18s;--ic-x:1px"><path d="M12 14.5v2.5" stroke="#000"/></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-lock-fill)"/></svg>
