<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-tilt{35%{transform:rotate(var(--ic-deg,-18deg))}55%{transform:rotate(calc(var(--ic-deg,-18deg) * .8))}80%{transform:rotate(calc(var(--ic-deg,-18deg) * -.1))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-tilt,.ic-trigger:hover .ic .ic-a-tilt{animation-name:ic-tilt}</style><mask id="ic-book-open-fill" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><g class="ic-a ic-a-tilt ic-o" style="transform-origin:12px 6.5px;--ic-delay:0.12s;--ic-deg:10deg"><path d="M12 7.3A1 1 0 0 0 11.22 6.33L4.83 4.91A1.5 1.5 0 0 0 3 6.37L3 16.86A1.5 1.5 0 0 0 4.1 18.31L10.42 20.06A1.25 1.25 0 0 0 12 18.86Z" fill="#fff" stroke="#fff"/></g><g class="ic-a ic-a-tilt ic-o" style="transform-origin:12px 6.5px;--ic-deg:-10deg"><path d="M12.78 6.33A1 1 0 0 0 12 7.3L12 18.86A1.25 1.25 0 0 0 13.58 20.06L19.9 18.31A1.5 1.5 0 0 0 21 16.86L21 6.37A1.5 1.5 0 0 0 19.17 4.91Z" fill="#fff" stroke="#fff"/></g><path d="M12 7v13" stroke="#000"/></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-book-open-fill)"/></svg>
