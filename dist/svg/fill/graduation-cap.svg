<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-swing{14%{transform:rotate(var(--ic-deg,16deg))}32%{transform:rotate(calc(var(--ic-deg,16deg) * -.7))}50%{transform:rotate(calc(var(--ic-deg,16deg) * .42))}68%{transform:rotate(calc(var(--ic-deg,16deg) * -.2))}84%{transform:rotate(calc(var(--ic-deg,16deg) * .07))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-swing,.ic-trigger:hover .ic .ic-a-swing{animation-name:ic-swing}@keyframes ic-bounce{30%{transform:translateY(var(--ic-y,-3px))}55%{transform:translateY(0) scale(1.06,.92)}72%{transform:translateY(calc(var(--ic-y,-3px) * .22)) scale(.98,1.02)}88%{transform:translateY(0)}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-bounce,.ic-trigger:hover .ic .ic-a-bounce{animation-name:ic-bounce}</style><mask id="ic-graduation-cap-fill" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><g class="ic-a ic-a-bounce ic-o" style="transform-origin:12px 19px;--ic-y:-2.5px"><path d="M7.5 12v4c0 1.66 2 3 4.5 3s4.5-1.34 4.5-3v-4Z" fill="#fff" stroke="#fff"/><path d="M6.58 10.79A2 2 0 0 1 6.58 7.21L11.33 4.84A1.5 1.5 0 0 1 12.67 4.84L17.42 7.21A2 2 0 0 1 17.42 10.79L12.67 13.16A1.5 1.5 0 0 1