<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-wiggle{15%{transform:rotate(var(--ic-deg,12deg))}35%{transform:rotate(calc(var(--ic-deg,12deg) * -.8))}55%{transform:rotate(calc(var(--ic-deg,12deg) * .45))}75%{transform:rotate(calc(var(--ic-deg,12deg) * -.15))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-wiggle,.ic-trigger:hover .ic .ic-a-wiggle{animation-name:ic-wiggle}</style><mask id="ic-tiktok-fill" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><g class="ic-a ic-a-wiggle ic-o" style="transform-origin:11px 20.75px;--ic-deg:10deg"><path fill-rule="evenodd" d="M12.65 3H14.25C14.5 5.5 16.75 7.25 19 7.25A.75.75 0 0 1 19.75 8V9.5A.75.75 0 0 1 19 10.25C17.25 10.25 15.5 9.6 14.25 8.5V15.75A5 5 0 1 1 11.65 11.36V4A1 1 0 0 1 12.65 3ZM11.65 15.75A2.4 2.4 0 1 0 6.85 15.75A2.4 2.4 0 1 0 11.65 15.75Z" fill="#fff" stroke="#fff"/></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-tiktok-fill)"/></svg>
