<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-wiggle{15%{transform:rotate(var(--ic-deg,12deg))}35%{transform:rotate(calc(var(--ic-deg,12deg) * -.8))}55%{transform:rotate(calc(var(--ic-deg,12deg) * .45))}75%{transform:rotate(calc(var(--ic-deg,12deg) * -.15))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-wiggle,.ic-trigger:hover .ic .ic-a-wiggle{animation-name:ic-wiggle}@keyframes ic-blink{40%,60%{transform:scaleY(1)}50%{transform:scaleY(.08)}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-blink,.ic-trigger:hover .ic .ic-a-blink{animation-name:ic-blink}</style><mask id="ic-android-fill" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><g class="ic-a ic-a-wiggle ic-o" style="transform-origin:7.5px 10.04px;--ic-deg:-14deg"><path d="M7.5 10.04L5.64 7.07" stroke="#fff"/></g><g class="ic-a ic-a-wiggle ic-o" style="transform-origin:16.5px 10.04px;--ic-delay:0.1s;--ic-deg:14deg"><path d="M16.5 10.04L18.36 7.07" stroke="#fff"/></g><path d="M5.16 17.25A1.5 1.5 0 0 1 3.7 15.43A8.5 8.5 0 0 1 20.3 15.43A1.5 1.5 0 0 1 18.84 17.25Z" fill="#fff" stroke="#fff"/><g class="ic-a ic-a-blink" style="--ic-delay:0.3s"><circle cx="8.75" cy="