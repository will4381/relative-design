<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-wiggle{15%{transform:rotate(var(--ic-deg,12deg))}35%{transform:rotate(calc(var(--ic-deg,12deg) * -.8))}55%{transform:rotate(calc(var(--ic-deg,12deg) * .45))}75%{transform:rotate(calc(var(--ic-deg,12deg) * -.15))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-wiggle,.ic-trigger:hover .ic .ic-a-wiggle{animation-name:ic-wiggle}@keyframes ic-pulse{45%{opacity:.15}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-pulse,.ic-trigger:hover .ic .ic-a-pulse{animation-name:ic-pulse}</style><mask id="ic-router-fill" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><g class="ic-a ic-a-wiggle ic-o" style="transform-origin:7px 12.5px;--ic-deg:-8deg"><path d="M7 12.5V5.5" stroke="#fff"/></g><g class="ic-a ic-a-wiggle ic-o" style="transform-origin:17px 12.5px;--ic-delay:0.08s;--ic-deg:8deg"><path d="M17 12.5V5.5" stroke="#fff"/></g><path d="M6 12.5h12a3 3 0 0 1 3 3v2a3 3 0 0 1-3 3h-12a3 3 0 0 1-3-3v-2a3 3 0 0 1 3-3Z" fill="#fff" stroke="#fff"/><g class="ic-a ic-a-pulse" style="--ic-delay:0.1s"><circle cx="7" cy="16.5" r="1" fill="#000" stroke="none"/></g><g class="ic-a ic-a-pulse" style="--ic-delay:0.2s"><circle cx="10.5" cy="16.5" r="1" fill="#000" stroke="none"/></g><g class="ic-a ic-a-pulse" style="--ic-delay:0.3s"><circle cx="14" cy="16.5" r="1" fill="#000" stroke="none"/></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-router-fill)"/></svg>
