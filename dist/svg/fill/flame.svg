<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-squash{30%{transform:scale(1.14,.86)}55%{transform:scale(.94,1.06)}75%{transform:scale(1.03,.97)}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-squash,.ic-trigger:hover .ic .ic-a-squash{animation-name:ic-squash}</style><mask id="ic-flame-fill" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><g class="ic-a ic-a-squash ic-o" style="transform-origin:12px 21px"><path d="M12 21a7 7 0 0 1-7-7c0-2.4 1.1-4.3 2.4-5.9a1.2 1.2 0 0 1 1.95.2l.85 1.6c.3-1.7.9-3.2 1.85-4.65a1.6 1.6 0 0 1 2.5-.3C17.2 7.6 19 10.6 19 14a7 7 0 0 1-7 7Z" fill="#fff" stroke="#fff"/><g class="ic-a ic-a-squash ic-o" style="transform-origin:12px 18px;--ic-delay:0.1s"><path d="M12 18a2.5 2.5 0 0 1-2.5-2.5c0-1.3 1-2.4 1.9-3.4a.8.8 0 0 1 1.2 0c.9 1 1.9 2.1 1.9 3.4A2.5 2.5 0 0 1 12 18Z" stroke="#000"/></g></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-flame-fill)"/></svg>
