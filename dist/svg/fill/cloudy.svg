<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-float{50%{transform:translate(var(--ic-x,0px),var(--ic-y,-2px))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-float,.ic-trigger:hover .ic .ic-a-float{animation-name:ic-float}</style><mask id="ic-cloudy-fill" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><g class="ic-a ic-a-float" style="--ic-delay:0.08s;--ic-x:-1.5px;--ic-y:0px"><path d="M13.94 11.38A2.48 2.48 0 0 1 13.94 6.42A3.41 3.41 0 0 1 20.76 6.48A2.48 2.48 0 0 1 20.14 11.38Z" fill="#fff" stroke="#fff"/></g><g class="ic-a ic-a-float" style="--ic-x:1.25px;--ic-y:0px"><path d="M6.32 20.39A3.44 3.44 0 0 1 6.32 13.51A4.73 4.73 0 0 1 15.78 13.6A3.44 3.44 0 0 1 14.92 20.39Z" fill="#000" stroke="#000" style="stroke-width:calc(var(--ic-stroke,2px) + 3px)"/><path d="M6.32 20.39A3.44 3.44 0 0 1 6.32 13.51A4.73 4.73 0 0 1 15.78 13.6A3.44 3.44 0 0 1 14.92 20.39Z" fill="#fff" stroke="#fff"/></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-cloudy-fill)"/></svg>
