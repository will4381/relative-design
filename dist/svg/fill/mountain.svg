<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-enter{0%{transform:translate(var(--ic-x,0px),var(--ic-y,0px));opacity:0}60%{opacity:1}75%{transform:translate(calc(var(--ic-x,0px) * -0.12),calc(var(--ic-y,0px) * -0.12))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-enter,.ic-trigger:hover .ic .ic-a-enter{animation-name:ic-enter}</style><mask id="ic-mountain-fill" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><g class="ic-a ic-a-enter" style="--ic-delay:0.05s;--ic-y:3px"><circle cx="18.5" cy="5" r="2" fill="#fff" stroke="#fff"/></g><path d="M4.92 19.5A1.25 1.25 0 0 1 3.78 17.74L7.2 10.04A2.25 2.25 0 0 1 11.21 9.83L12.2 11.54A0.75 0.75 0 0 0 13.44 11.63L13.59 11.43A2 2 0 0 1 16.93 11.74L20.04 17.67A1.25 1.25 0 0 1 18.93 19.5Z" fill="#000" stroke="#000" style="stroke-width:calc(var(--ic-stroke,2px) + 3px)"/><path d="M4.92 19.5A1.25 1.25 0 0 1 3.78 17.74L7.2 10.04A2.25 2.25 0 0 1 11.21 9.83L12.2 11.54A0.75 0.75 0 0 0 13.44 11.63L13.59 11.43A2 2 0 0 1 16.93 11.74L20.04 17.67A1.25 1.25 0 0 1 18.93 19.5Z" fill="#fff" stroke="#fff"/></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-mount