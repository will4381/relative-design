<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-tilt{35%{transform:rotate(var(--ic-deg,-18deg))}55%{transform:rotate(calc(var(--ic-deg,-18deg) * .8))}80%{transform:rotate(calc(var(--ic-deg,-18deg) * -.1))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-tilt,.ic-trigger:hover .ic .ic-a-tilt{animation-name:ic-tilt}</style><mask id="ic-option-fill" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 6.5h5l7 11h5" stroke="#fff"/><g class="ic-a ic-a-tilt ic-o" style="transform-origin:20.5px 6.5px;--ic-deg:22deg"><path d="M14.5 6.5h6" stroke="#fff"/></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-option-fill)"/></svg>
