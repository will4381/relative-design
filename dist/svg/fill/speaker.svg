<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-heartbeat{14%{transform:scale(var(--ic-s,1.18))}28%{transform:scale(.96)}42%{transform:scale(calc(1 + (var(--ic-s,1.18) - 1) * 0.75))}62%{transform:scale(1)}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-heartbeat,.ic-trigger:hover .ic .ic-a-heartbeat{animation-name:ic-heartbeat}</style><mask id="ic-speaker-fill" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 3h7a3.5 3.5 0 0 1 3.5 3.5v11a3.5 3.5 0 0 1-3.5 3.5h-7a3.5 3.5 0 0 1-3.5-3.5v-11a3.5 3.5 0 0 1 3.5-3.5Z" fill="#fff" stroke="#fff"/><circle cx="12" cy="7" r="1.25" fill="#000" stroke="none"/><g class="ic-a ic-a-heartbeat" style="--ic-s:1.2"><circle cx="12" cy="14.5" r="3.25" stroke="#000"/></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-speaker-fill)"/></svg>
