<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-enter{0%{transform:translate(var(--ic-x,0px),var(--ic-y,0px));opacity:0}60%{opacity:1}75%{transform:translate(calc(var(--ic-x,0px) * -0.12),calc(var(--ic-y,0px) * -0.12))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-enter,.ic-trigger:hover .ic .ic-a-enter{animation-name:ic-enter}</style><mask id="ic-java-fill" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><g class="ic-a ic-a-enter" style="--ic-y:1.75px"><path d="M8 6.25c-.9-1 .9-2 0-3.25" stroke="#fff"/></g><g class="ic-a ic-a-enter" style="--ic-delay:0.12s;--ic-y:1.75px"><path d="M12.5 6.25c-.9-1 .9-2 0-3.25" stroke="#fff"/></g><path d="M6.25 9h8a1.25 1.25 0 0 1 1.25 1.25v3a4.5 4.5 0 0 1-4.5 4.5h-1.5A4.5 4.5 0 0 1 5 13.25v-3A1.25 1.25 0 0 1 6.25 9Z" fill="#fff" stroke="#fff"/><path d="M15.5 10.5H17a2.25 2.25 0 0 1 0 4.5h-1.75" stroke="#fff"/><path d="M4 20.25c3 1 9.5 1 12.5 0" stroke="#fff"/></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-java-fill)"/></svg>
