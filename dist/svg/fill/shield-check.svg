<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-draw{0%{stroke-dashoffset:1;opacity:0}6%{opacity:1}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-draw,.ic-trigger:hover .ic .ic-a-draw{animation-name:ic-draw}</style><mask id="ic-shield-check-fill" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><path d="M11.25 3.3a2 2 0 0 1 1.5 0l6.2 2.45A1.6 1.6 0 0 1 20 7.25V11.5c0 4-3 7.1-6.7 9.1Q12 21.3 10.7 20.6C7 18.6 4 15.5 4 11.5V7.25a1.6 1.6 0 0 1 1.05-1.5Z" fill="#fff" stroke="#fff"/><g class="ic-a ic-a-draw"><path d="M8.75 12.25l2.25 2.25 4.25-4.5" pathLength="1" stroke-dasharray="1" stroke="#000"/></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-shield-check-fill)"/></svg>
