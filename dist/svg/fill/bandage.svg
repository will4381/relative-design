<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-squash{30%{transform:scale(1.14,.86)}55%{transform:scale(.94,1.06)}75%{transform:scale(1.03,.97)}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-squash,.ic-trigger:hover .ic .ic-a-squash{animation-name:ic-squash}</style><mask id="ic-bandage-fill" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><g class="ic-a ic-a-squash ic-o" style="transform-origin:12px 12px"><path d="M6.5 8h11a4 4 0 0 1 4 4v0a4 4 0 0 1-4 4h-11a4 4 0 0 1-4-4v-0a4 4 0 0 1 4-4Z" transform="rotate(45 12 12)" fill="#fff" stroke="#fff"/><path d="M9 8v8M15 8v8" transform="rotate(45 12 12)" stroke="#000"/><circle cx="11" cy="11" r="0.75" transform="rotate(45 12 12)" fill="#000" stroke="none"/><circle cx="13" cy="11" r="0.75" transform="rotate(45 12 12)" fill="#000" stroke="none"/><circle cx="11" cy="13" r="0.75" transform="rotate(45 12 12)" fill="#000" stroke="none"/><circle cx="13" cy="13" r="0.75" transform="rotate(45 12 12)" fill="#000" stroke="none"/></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-bandage-fill)"/></svg>
