<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-tilt{35%{transform:rotate(var(--ic-deg,-18deg))}55%{transform:rotate(calc(var(--ic-deg,-18deg) * .8))}80%{transform:rotate(calc(var(--ic-deg,-18deg) * -.1))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-tilt,.ic-trigger:hover .ic .ic-a-tilt{animation-name:ic-tilt}</style><mask id="ic-gavel-fill" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><path d="M6.25 17.25h6a1.75 1.75 0 0 1 1.75 1.75v0.25a1.75 1.75 0 0 1-1.75 1.75h-6a1.75 1.75 0 0 1-1.75-1.75v-0.25a1.75 1.75 0 0 1 1.75-1.75Z" fill="#fff" stroke="#fff"/><g class="ic-a ic-a-tilt ic-o" style="transform-origin:19.86px 16.86px;--ic-deg:-14deg"><path d="M12 9v12" transform="translate(1.5 -1.5) rotate(-45 12 12)" stroke="#fff"/></g><g class="ic-a ic-a-tilt ic-o" style="transform-origin:19.86px 16.86px;--ic-deg:-14deg"><path d="M8.75 3.5h6.5a2 2 0 0 1 2 2v1.5a2 2 0 0 1-2 2h-6.5a2 2 0 0 1-2-2v-1.5a2 2 0 0 1 2-2Z" transform="translate(1.5 -1.5) rotate(-45 12 12)" fill="#fff" stroke="#fff"/></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-gavel-fill)"/></svg>
