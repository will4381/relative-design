<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-squash{30%{transform:scale(1.14,.86)}55%{transform:scale(.94,1.06)}75%{transform:scale(1.03,.97)}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-squash,.ic-trigger:hover .ic .ic-a-squash{animation-name:ic-squash}@keyframes ic-enter{0%{transform:translate(var(--ic-x,0px),var(--ic-y,0px));opacity:0}60%{opacity:1}75%{transform:translate(calc(var(--ic-x,0px) * -0.12),calc(var(--ic-y,0px) * -0.12))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-enter,.ic-trigger:hover .ic .ic-a-enter{animation-name:ic-enter}</style><mask id="ic-pipette-fill" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 9.5A0.5 0.5 0 0 1 11 9L13 9A0.5 0.5 0 0 1 13.5 9.5L13.5 14.61A2.5 2.5 0 0 1 13.38 15.37L12.95 16.73A1 1 0 0 1 11.05 16.73L10.62 15.37A2.5 2.5 0 0 1 10.5 14.61Z" transform="translate(.75 -1.25) rotate(45 12 12)" fill="#fff" stroke="#fff"/><path d="M8.5 8.75h7" transform="translate(.75 -1.25) rotate(45 12 12)" fill="#000" stroke="#000" style="stroke-width:calc(var(--ic-stroke,2px) + 3px)"/><path d="M8.5 8.75h7" transform="translate(.75 -1.25) rotate(45 12 12)" fill="#fff" stroke="#fff"/><g class="ic-a ic-a-squash ic-o" style="transform-origin:16.11px 7.39px"><circle cx="12" cy="4.5" r="2.75" transform="translate(.75 -1.25) rotate(45 12 12)" fill="#000" stroke="#000" style="stroke-width:calc(var(--ic-stroke,2px) + 3px)"/><circle cx="12" cy="4.5" r="2.75" transform="translate(.75 -1.25) rotate(45 12 12)" fill="#fff" stroke="#fff"/></g><g class="ic-a ic-a-enter" style="--ic-delay:0.2s;--ic-y:-2.5px"><path d="M7.63 18.95A0.6 0.6 0 0 1 8.67 18.95L9.1 19.7A1.1 1.1 0 1 1 7.2 19.7Z" fill="#fff" stroke="#fff"/></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-pipette-fill)"/></svg>
