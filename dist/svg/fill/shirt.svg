<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-swing{14%{transform:rotate(var(--ic-deg,16deg))}32%{transform:rotate(calc(var(--ic-deg,16deg) * -.7))}50%{transform:rotate(calc(var(--ic-deg,16deg) * .42))}68%{transform:rotate(calc(var(--ic-deg,16deg) * -.2))}84%{transform:rotate(calc(var(--ic-deg,16deg) * .07))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-swing,.ic-trigger:hover .ic .ic-a-swing{animation-name:ic-swing}</style><mask id="ic-shirt-fill" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><g class="ic-a ic-a-swing ic-o" style="transform-origin:12px 3.5px;--ic-deg:10deg"><path d="M8.18 3.9A1 1 0 0 1 9.32 3.9L10.29 4.57A3 3 0 0 0 13.71 4.57L14.68 3.9A1 1 0 0 1 15.82 3.9L19.93 6.76A1.5 1.5 0 0 1 20.42 8.66L19.51 10.49A1.13 1.13 0 0 1 17.99 10.99L17.99 10.99A0.68 0.68 0 0 0 17 11.6L17 18.5A2 2 0 0 1 15 20.5L9 20.5A2 2 0 0 1 7 18.5L7 11.6A0.68 0.68 0 0 0 6.01 10.99L6.01 10.99A1.13 1.13 0 0 1 4.49 10.49L3.58 8.66A1.5 1.5 0 0 1 4.07 6.76Z" fill="#fff" stroke="#fff"/></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-shirt-fill)"/></svg>
