<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-shake{12%{transform:translate(var(--ic-x,0px),var(--ic-y,0px))}28%{transform:translate(calc(var(--ic-x,0px) * -0.85),calc(var(--ic-y,0px) * -0.85))}44%{transform:translate(calc(var(--ic-x,0px) * 0.6),calc(var(--ic-y,0px) * 0.6))}60%{transform:translate(calc(var(--ic-x,0px) * -0.35),calc(var(--ic-y,0px) * -0.35))}76%{transform:translate(calc(var(--ic-x,0px) * 0.15),calc(var(--ic-y,0px) * 0.15))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-shake,.ic-trigger:hover .ic .ic-a-shake{animation-name:ic-shake}@keyframes ic-enter{0%{transform:translate(var(--ic-x,0px),var(--ic-y,0px));opacity:0}60%{opacity:1}75%{transform:translate(calc(var(--ic-x,0px) * -0.12),calc(var(--ic-y,0px) * -0.12))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-enter,.ic-trigger:hover .ic .ic-a-enter{animation-name:ic-enter}</style><mask id="ic-cloud-lightning-fill" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><g class="ic-a ic-a-shake" style="--ic-delay:0.12s;--ic-x:0.75px"><path d="M7 13.5a4 4 0 0 1 1-7.9 5 5 0 0 1 9 .9 3.5 3.5 0 0 1 0 7Z" fill="#fff" stroke="#fff"/></g><g class="ic-a ic-a-enter"