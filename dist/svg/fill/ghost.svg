<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-blink{40%,60%{transform:scaleY(1)}50%{transform:scaleY(.08)}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-blink,.ic-trigger:hover .ic .ic-a-blink{animation-name:ic-blink}@keyframes ic-float{50%{transform:translate(var(--ic-x,0px),var(--ic-y,-2px))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-float,.ic-trigger:hover .ic .ic-a-float{animation-name:ic-float}</style><mask id="ic-ghost-fill" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><g class="ic-a ic-a-float" style="--ic-y:-2.5px"><path d="M5 11a7 7 0 0 1 14 0v7.5a2.33 2.33 0 0 1-4.67 0 2.33 2.33 0 0 1-4.66 0A2.33 2.33 0 0 1 5 18.5Z" fill="#fff" stroke="#fff"/><g class="ic-a ic-a-blink" style="--ic-delay:0.2s"><circle cx="9.5" cy="11" r="1.25" fill="#000" stroke="none"/></g><g class="ic-a ic-a-blink" style="--ic-delay:0.2s"><circle cx="14.5" cy="11" r="1.25" fill="#000" stroke="none"/></g></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-ghost-fill)"/></svg>
