<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-squash{30%{transform:scale(1.14,.86)}55%{transform:scale(.94,1.06)}75%{transform:scale(1.03,.97)}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-squash,.ic-trigger:hover .ic .ic-a-squash{animation-name:ic-squash}</style><mask id="ic-api-fill" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><path d="M7 6h10a4 4 0 0 1 4 4v4a4 4 0 0 1-4 4h-10a4 4 0 0 1-4-4v-4a4 4 0 0 1 4-4Z" fill="#fff" stroke="#fff"/><g class="ic-a ic-a-squash ic-o" style="transform-origin:7.75px 15px"><path d="M5.25 15L7.06 10.66A0.75 0.75 0 0 1 8.44 10.66L10.25 15M6.05 13.1h3.4" stroke="#000"/></g><g class="ic-a ic-a-squash ic-o" style="transform-origin:14.25px 15px;--ic-delay:0.08s"><path d="M12.75 15V9H14a1.75 1.75 0 0 1 0 3.5h-1.25" stroke="#000"/></g><g class="ic-a ic-a-squash ic-o" style="transform-origin:18.5px 15px;--ic-delay:0.16s"><path d="M18.5 9v6" stroke="#000"/></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-api-fill)"/></svg>
