<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-wiggle{15%{transform:rotate(var(--ic-deg,12deg))}35%{transform:rotate(calc(var(--ic-deg,12deg) * -.8))}55%{transform:rotate(calc(var(--ic-deg,12deg) * .45))}75%{transform:rotate(calc(var(--ic-deg,12deg) * -.15))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-wiggle,.ic-trigger:hover .ic .ic-a-wiggle{animation-name:ic-wiggle}@keyframes ic-shake{12%{transform:translate(var(--ic-x,0px),var(--ic-y,0px))}28%{transform:translate(calc(var(--ic-x,0px) * -0.85),calc(var(--ic-y,0px) * -0.85))}44%{transform:translate(calc(var(--ic-x,0px) * 0.6),calc(var(--ic-y,0px) * 0.6))}60%{transform:translate(calc(var(--ic-x,0px) * -0.35),calc(var(--ic-y,0px) * -0.35))}76%{transform:translate(calc(var(--ic-x,0px) * 0.15),calc(var(--ic-y,0px) * 0.15))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-shake,.ic-trigger:hover .ic .ic-a-shake{animation-name:ic-shake}</style><mask id="ic-bug-fill" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><g class="ic-a ic-a-wiggle ic-o" style="transform-origin:6.5px 13px;--ic-deg:12deg"><path d="M6.5 13H3.5M6.5 17.5l-2.5 2M6.5 9.5L4 7.5" stroke="#fff"/></g><g class="ic-a ic-a-wiggle ic-o" style="transform-origin:17.5px 13px;--ic-deg:-12deg"><path d="M17.5 13h3M17.5 17.5l2.5 2M17.5 9.5l2.5-2" stroke="#fff"/></g><g class="ic-a ic-a-shake" style="--ic-x:0.75px"><path d="M12 8a5.5 5.5 0 0 1 5.5 5.5v2a5.5 5.5 0 0 1-11 0v-2A5.5 5.5 0 0 1 12 8Z" fill="#fff" stroke="#fff"/></g><g class="ic-a ic-a-shake" style="--ic-x:0.75px"><path d="M12 12.5v5" stroke="#000"/></g><g class="ic-a ic-a-shake" style="--ic-x:0.75px"><path d="M8.5 8a3.5 3.5 0 0 1 7 0Z" fill="#000" stroke="#000" style="stroke-width:calc(var(--ic-stroke,2px) + 3px)"/><path d="M8.5 8a3.5 3.5 0 0 1 7 0Z" fill="#fff" stroke="#fff"/></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-bug-fill)"/></svg>
