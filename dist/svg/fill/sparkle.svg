<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-twinkle{30%{transform:scale(.55) rotate(-25deg)}65%{transform:scale(1.18) rotate(8deg)}85%{transform:scale(.97) rotate(-2deg)}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-twinkle,.ic-trigger:hover .ic .ic-a-twinkle{animation-name:ic-twinkle}</style><mask id="ic-sparkle-fill" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><g class="ic-a ic-a-twinkle"><path d="M12 7.5Q12 12 16.5 12A1.5 1.5 0 0 1 16.5 15Q12 15 12 19.5A1.5 1.5 0 0 1 9 19.5Q9 15 4.5 15A1.5 1.5 0 0 1 4.5 12Q9 12 9 7.5A1.5 1.5 0 0 1 12 7.5Z" fill="#fff" stroke="#fff"/></g><g class="ic-a ic-a-twinkle" style="--ic-delay:0.12s"><path d="M18.6 3.6Q18.6 5.4 20.4 5.4A0.6 0.6 0 0 1 20.4 6.6Q18.6 6.6 18.6 8.4A0.6 0.6 0 0 1 17.4 8.4Q17.4 6.6 15.6 6.6A0.6 0.6 0 0 1 15.6 5.4Q17.4 5.4 17.4 3.6A0.6 0.6 0 0 1 18.6 3.6Z" fill="#fff" stroke="#fff"/></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-sparkle-fill)"/></svg>
