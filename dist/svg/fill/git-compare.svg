<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-draw{0%{stroke-dashoffset:1;opacity:0;animation-timing-function:cubic-bezier(.25,.8,.3,1)}5%{opacity:1}40%{stroke-dashoffset:0}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-draw,.ic-trigger:hover .ic .ic-a-draw{animation-name:ic-draw}@keyframes ic-grow{0%{transform:scale(0)}55%{transform:scale(1.15)}75%{transform:scale(.95)}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-grow,.ic-trigger:hover .ic .ic-a-grow{animation-name:ic-grow}@keyframes ic-pop{35%{transform:scale(var(--ic-s,1.18))}60%{transform:scale(calc(1 + (var(--ic-s,1.18) - 1) * -0.35))}80%{transform:scale(calc(1 + (var(--ic-s,1.18) - 1) * 0.12))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-pop,.ic-trigger:hover .ic .ic-a-pop{animation-name:ic-pop}</style><mask id="ic-git-compare-fill" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><g class="ic-a ic-a-draw"><path d="M6 8.5V15a3 3 0 0 0 3 3h3" pathLength="1" stroke-dasharray="1" stroke="#fff"/></g><g class="ic-a ic-a-grow ic-o" style="transform-origin:12px 18px;--ic-delay:0.3s"><path d="M9.5 15.5 12 18l-2.5 2.5" stroke="#fff"/></g><g class="ic-a ic-a-draw"