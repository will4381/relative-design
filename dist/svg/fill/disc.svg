<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-spin{to{transform:rotate(var(--ic-deg,360deg))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-spin,.ic-trigger:hover .ic .ic-a-spin{animation-name:ic-spin}</style><mask id="ic-disc-fill" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" fill="#fff" stroke="#fff"/><g class="ic-a ic-a-spin ic-o" style="transform-origin:12px 12px;--ic-deg:180deg"><path d="M6.09 10.96A6 6 0 0 1 9.95 6.36" stroke="#000"/></g><g class="ic-a ic-a-spin ic-o" style="transform-origin:12px 12px;--ic-deg:180deg"><path d="M17.91 13.04A6 6 0 0 1 14.05 17.64" stroke="#000"/></g><circle cx="12" cy="12" r="2.25" stroke="#000"/></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-disc-fill)"/></svg>
