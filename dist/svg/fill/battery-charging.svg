<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-pop{35%{transform:scale(var(--ic-s,1.18))}60%{transform:scale(calc(1 + (var(--ic-s,1.18) - 1) * -0.35))}80%{transform:scale(calc(1 + (var(--ic-s,1.18) - 1) * 0.12))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-pop,.ic-trigger:hover .ic .ic-a-pop{animation-name:ic-pop}</style><mask id="ic-battery-charging-fill" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6.5h9.5a3 3 0 0 1 3 3v5a3 3 0 0 1-3 3h-9.5a3 3 0 0 1-3-3v-5a3 3 0 0 1 3-3Z" fill="#fff" stroke="#fff"/><path d="M21 10.5v3" stroke="#fff"/><g class="ic-a ic-a-pop" style="--ic-s:1.1"><path d="M12.5 9L10.7 10.95A0.63 0.63 0 0 0 11.25 12L11.25 12A0.63 0.63 0 0 1 11.8 13.05L10 15" stroke="#000"/></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-battery-charging-fill)"/></svg>
