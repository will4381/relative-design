<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-bounce{30%{transform:translateY(var(--ic-y,-3px))}55%{transform:translateY(0) scale(1.06,.92)}72%{transform:translateY(calc(var(--ic-y,-3px) * .22)) scale(.98,1.02)}88%{transform:translateY(0)}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-bounce,.ic-trigger:hover .ic .ic-a-bounce{animation-name:ic-bounce}</style><mask id="ic-boxes-fill" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><g class="ic-a ic-a-bounce ic-o" style="transform-origin:6.38px 21px;--ic-y:-1.5px"><path d="M5 14.25h2.75a2 2 0 0 1 2 2v2.75a2 2 0 0 1-2 2h-2.75a2 2 0 0 1-2-2v-2.75a2 2 0 0 1 2-2Z" fill="#fff" stroke="#fff"/></g><g class="ic-a ic-a-bounce ic-o" style="transform-origin:17.63px 21px;--ic-delay:0.08s;--ic-y:-1.5px"><path d="M16.25 14.25h2.75a2 2 0 0 1 2 2v2.75a2 2 0 0 1-2 2h-2.75a2 2 0 0 1-2-2v-2.75a2 2 0 0 1 2-2Z" fill="#fff" stroke="#fff"/></g><g class="ic-a ic-a-bounce ic-o" style="transform-origin:12px 9.75px;--ic-delay:0.2s;--ic-y:-2.5px"><path d="M10.63 3h2.75a2 2 0 0 1 2 2v2.75a2 2 0 0 1-2 2h-2.75a2 2 0 0 1-2-2v-2.75a2 2 0 0 1 2-2Z" fill="#fff" stroke="#fff"/></g></g></mask><rect x="-6"