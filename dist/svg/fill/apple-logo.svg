<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-swing{14%{transform:rotate(var(--ic-deg,16deg))}32%{transform:rotate(calc(var(--ic-deg,16deg) * -.7))}50%{transform:rotate(calc(var(--ic-deg,16deg) * .42))}68%{transform:rotate(calc(var(--ic-deg,16deg) * -.2))}84%{transform:rotate(calc(var(--ic-deg,16deg) * .07))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-swing,.ic-trigger:hover .ic .ic-a-swing{animation-name:ic-swing}</style><mask id="ic-apple-logo-fill" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9C13.25 7.75 15 7.25 16.5 7.5 17.4 7.65 18.1 8.15 18.7 9A3.5 3.5 0 0 0 18.75 14.5C19.1 16.25 18.25 19 16.75 20.25 15.75 21 14.75 21 13.75 20.5Q12 19.75 10.25 20.5C9.25 21 8.25 21 7.25 20.25 5.5 19 4.25 16.25 4.25 13.5 4.25 9.75 6.5 7.25 9.25 7.25 10.25 7.25 11.25 8.25 12 9Z" fill="#fff" stroke="#fff"/><g class="ic-a ic-a-swing ic-o" style="transform-origin:12.75px 6px;--ic-deg:16deg"><path d="M13.91 5.93A0.82 0.82 0 0 1 12.95 4.88L12.95 4.88A2.6 2.6 0 0 1 14.81 3.16L15.02 3.11A0.8 0.8 0 0 1 15.95 4.17L15.94 4.21A2.78 2.78 0 0 1 13.95 5.92Z" fill="#fff" stroke="#fff"/></g></g></mask><rect x="-6" y="-6" width