<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-turn{70%{transform:rotate(calc(var(--ic-deg,360deg) * 1.04))}100%{transform:rotate(var(--ic-deg,360deg))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-turn,.ic-trigger:hover .ic .ic-a-turn{animation-name:ic-turn}</style><mask id="ic-life-buoy-fill" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><g class="ic-a ic-a-turn ic-o" style="transform-origin:12px 12px;--ic-deg:90deg"><circle cx="12" cy="12" r="9" fill="#fff" stroke="#fff"/><circle cx="12" cy="12" r="4" stroke="#000"/><path d="M14.83 9.17l3.53-3.53M9.17 9.17 5.64 5.64M9.17 14.83l-3.53 3.53M14.83 14.83l3.53 3.53" stroke="#000"/></g></g></mask><rect x="-6" y="-6" width="36" height="36" fill="currentColor" mask="url(#ic-life-buoy-fill)"/></svg>
