<svg xmlns="http://www.w3.org/2000/svg" class="ic ic-hover" width="24" height="24" viewBox="0 0 24 24" fill="none" overflow="visible" aria-hidden="true"><style>.ic{overflow:visible}.ic .ic-a{transform-box:fill-box;transform-origin:center}.ic .ic-o{transform-box:view-box}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a,.ic-trigger:hover .ic .ic-a{animation-duration:var(--ic-dur,.9s);animation-timing-function:var(--ic-ease,cubic-bezier(.45,0,.25,1));animation-iteration-count:var(--ic-iter,1);animation-delay:calc(var(--ic-delay,0s) - var(--ic-seek,0s));animation-fill-mode:backwards}.ic-loop{--ic-iter:infinite}.ic .ic-a-spin{--ic-ease:linear}@media (prefers-reduced-motion:reduce){.ic .ic-a{animation:none!important}}@keyframes ic-swing{14%{transform:rotate(var(--ic-deg,16deg))}32%{transform:rotate(calc(var(--ic-deg,16deg) * -.7))}50%{transform:rotate(calc(var(--ic-deg,16deg) * .42))}68%{transform:rotate(calc(var(--ic-deg,16deg) * -.2))}84%{transform:rotate(calc(var(--ic-deg,16deg) * .07))}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-swing,.ic-trigger:hover .ic .ic-a-swing{animation-name:ic-swing}@keyframes ic-blink{40%,60%{transform:scaleY(1)}50%{transform:scaleY(.08)}}.ic:is(.ic-hover:hover,.ic-loop,.ic-play) .ic-a-blink,.ic-trigger:hover .ic .ic-a-blink{animation-name:ic-blink}</style><mask id="ic-bot-fill" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#000"/><g fill="none" style="stroke-width:var(--ic-stroke,2px)" stroke-linecap="round" stroke-linejoin="round"><g class="ic-a ic-a-swing ic-o" style="transform-origin:12px 8px;--ic-deg:16deg"><path d="M12 8V5.5" stroke="#fff"/></g><g class="ic-a ic-a-swing ic-o" style="transform-origin:12px 8px;--ic-deg:16deg"><circle cx="12" cy="4.25" r="1" fill="#fff" stroke="#fff"/></g><path d="M5 12h-.5A1.5 1.5 0 0 0 3 13.5v1A1.5 1.5 0 0 0 4.5 16H5M19 12h.5a1.5 1.5 0 0 1 1.5 1.5v1a1.5 1.5 0 0 1-1.5 1.5H19" fill="#fff" stroke="#fff"/><path d="M9 8h6a4 4 0 0 1 4 4v4.